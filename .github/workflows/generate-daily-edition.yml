name: Autonomous Daily News & Trending Generation

on:
  schedule:
    # Runs autonomously 4 times a day (every 6 hours) at global market opens: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      trending_only:
        description: 'Update Trending desk only'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Fresh News Edition & Ingest Trending Telemetry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.trending_only }}" = "true" ]; then
            node scripts/generate-daily-edition.js --trending-only
          else
            node scripts/generate-daily-edition.js
          fi

      - name: Commit & Push Daily Edition
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-edition.json data/daily-edition-meta.json
          if ! git diff --staged --quiet; then
            echo "Changes detected in daily edition. Committing and pushing..."
            git commit -m "chore(daily): publish fresh trending market edition [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No daily edition changes detected to commit."
          fi
